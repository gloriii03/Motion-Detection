name: Deploy to GitHub Pages
on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Debug runner environment
        run: |
          echo "Runner info:";
          uname -a || ver;
          echo "\nGit version:"; git --version || true;
          echo "\nWorkspace files:"; ls -la;
          echo "\nGit status:"; git status || true;
          echo "\nGit remotes:"; git remote -v || true;

      - name: Publish to GitHub Pages (gh-pages)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_PAT: ${{ secrets.PERSONAL_PAT }}
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "github-actions[bot]"
          PUBLISH_TOKEN="$PERSONAL_PAT"
          if [ -z "$PUBLISH_TOKEN" ]; then
            PUBLISH_TOKEN="$GITHUB_TOKEN"
          fi
          echo "Using token length: ${#PUBLISH_TOKEN} (masked)"
          npx --yes gh-pages -d dist -r "https://x-access-token:${PUBLISH_TOKEN}@github.com/${{ github.repository }}.git"

      - name: Ensure GitHub Pages site is configured
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_PAT: ${{ secrets.PERSONAL_PAT }}
        run: |
          echo "Configuring GitHub Pages to serve from 'gh-pages' branch..."
          PUBLISH_TOKEN="$PERSONAL_PAT"
          if [ -z "$PUBLISH_TOKEN" ]; then
            PUBLISH_TOKEN="$GITHUB_TOKEN"
          fi
          echo "Using token source: ${PERSONAL_PAT:+PERSONAL_PAT}${PERSONAL_PAT:+ }${GITHUB_TOKEN:+GITHUB_TOKEN}"
          resp_file=$(mktemp)
          http_code=$(curl -s -o "$resp_file" -w "%{http_code}" -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${PUBLISH_TOKEN}" \
            https://api.github.com/repos/${{ github.repository }}/pages \
            -d '{"source":{"branch":"gh-pages","path":"/"}}' || true)
          echo "Pages API PUT HTTP status: $http_code"
          echo "Pages API PUT response:"; cat "$resp_file" || true
          verify_http_code=$(curl -s -o "$resp_file" -w "%{http_code}" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${PUBLISH_TOKEN}" \
            https://api.github.com/repos/${{ github.repository }}/pages || true)
          echo "Pages API GET HTTP status: $verify_http_code"
          echo "Pages API GET response:"; cat "$resp_file" || true
          rm -f "$resp_file"
